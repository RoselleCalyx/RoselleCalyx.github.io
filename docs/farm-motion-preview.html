<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Farm Motion Preview</title>
<base href="../">
<link rel="stylesheet" href="css/style.css?v=20261009-life6">
<style>
  body { background:#eee9dc; color:#354536; font-family:system-ui,sans-serif; padding:32px; }
  main { max-width:1100px; margin:auto; }
  h1 { font:500 28px Georgia,serif; } p { color:#63715e; line-height:1.6; }
  .controls { display:flex; gap:16px; align-items:center; flex-wrap:wrap; margin:24px 0; }
  button, select { font:inherit; background:#fff9eb; color:#354536; border:1px solid #c2c6ac; border-radius:8px; padding:9px 13px; }
  .motion-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:16px; }
  article { overflow:hidden; padding:16px; background:#f8f4e9; border:1px solid #d5d5bf; border-radius:16px; }
  .stage { position:relative; height:230px; background:linear-gradient(transparent 91%,#b9c4a2 91%,#d9ddc5 92%); }
  .actor { width:170px; left:50%; top:calc(92% - var(--preview-lift, 0px)); cursor:default; }
  .caption { display:flex; justify-content:space-between; gap:8px; margin-top:12px; font-size:14px; }
  small { color:#74816c; }
  .frame-readout { font-variant-numeric:tabular-nums; }
  a { color:#587055; } @media(max-width:600px) { body { padding:18px; } }
</style>
<main>
  <h1>Farm Motion Preview</h1>
  <p>Compare the walks, eight-frame jumps and resting poses of eight animals. Rabbits hop as they move.<br>Pause and step through each frame to inspect takeoff, flight and landing.</p>
  <div class="controls">
    <button id="pause">Pause</button><button id="step">Next frame</button><button id="flip">Turn around</button>
    <label>Speed <input id="speed" type="range" min="0.3" max="1.8" step="0.1" value="1"><output id="speedValue">1×</output></label>
    <label>Pose <select id="pose"><option value="walk">Walk / rabbit hop</option><option value="jump">Full jump (eight frames)</option><option value="sit">Sit</option><option value="sleep">Rest / sleep</option><option value="stand">Stand (snow leopard cat)</option><option value="stretch">Stretch (snow leopard cat)</option><option value="sniff">Sniff (snow leopard cat)</option></select></label>
  </div>
  <div class="motion-grid" id="grid"></div>
  <p><a href="farm.html">Back to the farm</a> · <a href="docs/farm-motion-contact-sheet.webp">View all poses</a></p>
</main>
<script src="js/farm-motion.js"></script><script src="js/farm-art.js?v=20261010-english-ui"></script>
<script>
  const grid = document.getElementById('grid'), pose = document.getElementById('pose');
  const pause = document.getElementById('pause'), step = document.getElementById('step'), flip = document.getElementById('flip');
  const speed = document.getElementById('speed'), speedValue = document.getElementById('speedValue');
  const entries = Object.entries(FarmArt.SPECIES).map(([sp, s]) => {
    const article = document.createElement('article');
    article.innerHTML = `<div class="stage"><div class="actor walk-ready jump-ready" data-species="${sp}" data-pose="walk"><div class="flip"><div class="bob">${FarmArt.ART[sp]()}${FarmArt.walkSprite(sp)}${FarmArt.jumpSprite(sp)}${FarmArt.poseSprite(sp)}</div></div></div></div><div class="caption"><span>${s.label}</span><small class="frame-readout"></small></div>`;
    grid.append(article);
    return { sp, s, actor:article.querySelector('.actor'), sprite:article.querySelector('.walk-sprite'), readout:article.querySelector('.frame-readout'), phase:0 };
  });
  let running = !matchMedia('(prefers-reduced-motion:reduce)').matches, last = performance.now();
  function paint(e) {
    const p = pose.value, actual = p === 'walk' || p === 'jump' || p === 'sit' || FarmArt.POSES[e.sp][p] ? p : 'sit';
    e.actor.dataset.pose = actual;
    e.actor.classList.toggle('walking', actual === 'walk' && e.s.gait !== 'hop');
    e.actor.classList.toggle('hopping', actual === 'walk' && e.s.gait === 'hop');
    e.actor.classList.toggle('sleeping', actual === 'sleep');
    e.actor.classList.toggle('leaping',actual==='jump');
    const leap=FarmMotion.leap(e.phase);
    e.actor.querySelector('.jump-sprite').style.backgroundPositionX=leap.frame*100/7+'%';
    e.actor.querySelector('.jump-sprite-next').style.backgroundPositionX=leap.next*100/7+'%';
    e.actor.style.setProperty('--jump-blend',leap.blend.toFixed(3));
    const bounding=actual==='jump'||(actual==='walk'&&e.s.gait==='hop');
    const air=Math.min(1,Math.max(0,(e.phase-.26)/.56));
    e.actor.style.setProperty('--preview-lift',(bounding?Math.sin(Math.PI*air)*(actual==='jump'?32:12):0)+'px');
    const sample=FarmMotion.sample(e.phase,e.sp);
    e.sprite.style.backgroundPositionX = sample.frame*100/(FarmMotion.GAITS[e.sp].frames-1)+'%';
    e.actor.querySelector('.walk-sprite-next').style.backgroundPositionX=sample.next*100/(FarmMotion.GAITS[e.sp].frames-1)+'%';
    e.actor.style.setProperty('--gait-blend',sample.blend.toFixed(3));
    e.readout.textContent = actual === 'jump' ? `${leap.frame+1} / 8` : actual === 'walk' ? `${FarmMotion.frame(e.phase,e.sp)+1} / ${FarmMotion.GAITS[e.sp].frames}` : '';
  }
  function frame(now) {
    const dt = Math.min(.1,(now-last)/1000); last = now;
    entries.forEach(e => {
      if (running && pose.value === 'walk') e.phase = FarmMotion.advance(e.phase, e.s.speed * 16 * dt * +speed.value, 8.1 * e.s.size * 16, e.sp);
      if (running && pose.value === 'jump') e.phase=(e.phase+dt*+speed.value/1.8)%1;
      paint(e);
    }); requestAnimationFrame(frame);
  }
  pause.onclick = () => { running = !running; pause.textContent = running ? 'Pause' : 'Play'; document.body.classList.toggle('farm-calm',!running); };
  step.onclick = () => { running = false; pause.textContent = 'Play'; document.body.classList.add('farm-calm'); entries.forEach(e=>{ e.phase = (e.phase + 1/(pose.value==='jump'?8:FarmMotion.GAITS[e.sp].frames) + 1e-9)%1; paint(e); }); };
  flip.onclick = () => entries.forEach(e=>e.actor.classList.toggle('left'));
  speed.oninput = () => { speedValue.value = speed.value+'×'; };
  if (!running) { pause.textContent = 'Play'; document.body.classList.add('farm-calm'); }
  requestAnimationFrame(frame);
</script>
</html>
