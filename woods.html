<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Into the Woods · Chen Jia</title>
  <meta name="description" content="Beyond the farm fence: wild bayberries, mushrooms after rain, bamboo shoots and whatever the season leaves." />
  <meta name="theme-color" content="#04060d" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23f4e2b4' d='M12 1c.5 6.4 4.6 10.5 11 11-6.4.5-10.5 4.6-11 11-.5-6.4-4.6-10.5-11-11 6.4-.5 10.5-4.6 11-11z'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css?v=20261010-owner-polish1" />
  <link rel="preload" href="assets/fonts/montserrat-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/cassini-type.css?v=20261009-1" />
  <link rel="stylesheet" href="css/mobile.css?v=20261009-4" />
  <link rel="stylesheet" href="css/wild-companion.css?v=20261010-guardian" />
</head>
<body data-page="farm" class="wild-body" data-wild="woods">
  <header id="site-header"></header>

  <main class="farm-page wild-page">
    <div class="farm-head">
      <div class="farm-title-group">
        <p class="kicker">Beyond the fence</p>
        <h1 class="page-title"><span data-page-copy="title">Into the Woods</span><span class="farm-title-star" aria-hidden="true">✧</span></h1>
        <p class="page-sub" data-page-copy="subtitle">Wild bayberries, mushrooms, and bamboo shoots.</p>
      </div>
      <p class="farm-welcome">Walk softly.<br />Take only what is ripe.</p>
    </div>

    <section class="farm-frame wild-frame" aria-label="A forest clearing beyond the farm">
      <div class="farm-scene-top">
        <div class="farm-hud">
          <button class="wild-back" type="button" id="btnBack"><span aria-hidden="true">←</span> The farm</button>
          <div class="season-chip" id="seasonChip" aria-live="polite"></div>
          <div class="basket" id="basket" aria-live="polite"></div>
        </div>
        <span class="farm-population"><span aria-hidden="true">❦</span>The woods</span>
      </div>
      <div class="wild-stage" id="stage">
        <canvas id="scene" aria-label="A forest clearing. Tap ripe berries and mushrooms to gather them."></canvas>
        <div class="wild-tip" id="tip" aria-hidden="true"></div>
        <div class="guardian-menu" id="guardianMenu" role="group" aria-label="Guardian actions" hidden>
          <button class="guardian-button" type="button" data-guardian-action="feed" aria-label="Feed the guardian" title="Feed">
            <svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M20 15V9" stroke="#bd9a75" stroke-width="1.4" stroke-linecap="round"/><path d="M20 12c0-5 5-7 10-5-1 5-6 7-10 5Z" fill="#9ecb83"/><path d="M20 15c-6-5-14-1-14 7 0 7 5 13 10 13 2 0 3-1 4-1s2 1 4 1c5 0 10-6 10-13 0-8-8-12-14-7Z" fill="#e76158"/></svg>
          </button>
          <button class="guardian-button" type="button" data-guardian-action="pet" aria-label="Pet the guardian" title="Pet">
            <svg viewBox="0 0 40 40" fill="#c6afe9" aria-hidden="true"><ellipse cx="7.5" cy="17" rx="4.4" ry="5.5" transform="rotate(-25 7.5 17)"/><ellipse cx="15" cy="9" rx="4.4" ry="5.5" transform="rotate(-12 15 9)"/><ellipse cx="25" cy="9" rx="4.4" ry="5.5" transform="rotate(12 25 9)"/><ellipse cx="32.5" cy="17" rx="4.4" ry="5.5" transform="rotate(25 32.5 17)"/><path d="M20 18c-4 0-5.5 4.8-8.5 7.8-2.7 2.7-4.4 5.4-2.7 8C10.5 37 15 35 20 35s9.5 2 11.2-1.2c1.7-2.6 0-5.3-2.7-8C25.5 22.8 24 18 20 18Z"/></svg>
          </button>
        </div>
      </div>
      <div class="guardian-food" id="guardianFood" role="dialog" aria-labelledby="guardianFoodTitle" aria-describedby="guardianFoodNote" hidden>
        <button class="guardian-close" type="button" data-guardian-close aria-label="Close snack choices">×</button>
        <h3 id="guardianFoodTitle">Choose a snack</h3>
        <p class="guardian-food-note" id="guardianFoodNote">A little treat for your guardian.</p>
        <div class="guardian-food-tray" id="guardianFoodTray"></div>
      </div>
      <div class="farm-scene-bottom">
        <p class="farm-hint"><span aria-hidden="true">✧</span><b class="wild-hint" id="hint" aria-live="polite"></b></p>
      </div>
      <div class="guardian-actions" id="guardianActions" role="group" aria-label="Keep the guardian company">
        <p class="guardian-intro"><b id="guardianName">Matcha</b><small>A little company along the way.</small></p>
        <div class="guardian-action-row">
          <button class="guardian-button" type="button" data-guardian-action="feed"><svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M20 15V9" stroke="#bd9a75" stroke-width="1.4" stroke-linecap="round"/><path d="M20 12c0-5 5-7 10-5-1 5-6 7-10 5Z" fill="#9ecb83"/><path d="M20 15c-6-5-14-1-14 7 0 7 5 13 10 13 2 0 3-1 4-1s2 1 4 1c5 0 10-6 10-13 0-8-8-12-14-7Z" fill="#e76158"/></svg><span>Feed</span></button>
          <button class="guardian-button" type="button" data-guardian-action="pet"><svg viewBox="0 0 40 40" fill="#c6afe9" aria-hidden="true"><ellipse cx="7.5" cy="17" rx="4.4" ry="5.5" transform="rotate(-25 7.5 17)"/><ellipse cx="15" cy="9" rx="4.4" ry="5.5" transform="rotate(-12 15 9)"/><ellipse cx="25" cy="9" rx="4.4" ry="5.5" transform="rotate(12 25 9)"/><ellipse cx="32.5" cy="17" rx="4.4" ry="5.5" transform="rotate(25 32.5 17)"/><path d="M20 18c-4 0-5.5 4.8-8.5 7.8-2.7 2.7-4.4 5.4-2.7 8C10.5 37 15 35 20 35s9.5 2 11.2-1.2c1.7-2.6 0-5.3-2.7-8C25.5 22.8 24 18 20 18Z"/></svg><span>Pet</span></button>
        </div>
        <span class="guardian-feedback" id="guardianFeedback" aria-live="polite" aria-atomic="true">A quiet companion. Tap to offer a snack or a gentle pat.</span>
      </div>
    </section>

    <div class="farm-actions wild-actions" aria-label="In the woods">
      <button type="button" id="btnJournal"><span class="farm-action-icon" data-icon="book"></span><span><b>Field journal</b><small>Everything you have found</small></span><span class="farm-action-arrow" aria-hidden="true">↗</span></button>
      <button type="button" id="btnLook"><span class="farm-action-icon" data-icon="search"></span><span><b>Look around</b><small>Spot what is ready to pick</small></span><span class="farm-action-arrow" aria-hidden="true">↗</span></button>
      <button type="button" id="btnMatcha"><span class="farm-action-icon" data-icon="paw"></span><span><b>Ask Matcha</b><small>What grows this season?</small></span><span class="farm-action-arrow" aria-hidden="true">↗</span></button>
      <button type="button" id="btnBack2"><span class="farm-action-icon" data-icon="left"></span><span><b>Back to the farm</b><small>The orchard is waiting</small></span><span class="farm-action-arrow" aria-hidden="true">↙</span></button>
    </div>
  </main>

  <script>window.SKY_OPTIONS = { moon: false, milkyWay: false, meteors: 0.12 };</script>
  <script src="js/config.js"></script>
  <script src="data/farm.js"></script>

  <script type="text/plain" data-site-src="js/farm-art.js?v=20261010-guardian"></script>
  <script type="text/plain" data-site-src="js/animal-reactions.js?v=20261010-guardian"></script>
  <script type="text/plain" data-site-src="js/wild-companion.js?v=20261010-guardian"></script>
  <script type="text/plain" data-site-src="js/meadow-props.js?v=20261009-life6"></script>
  <script type="text/plain" data-site-src="js/scene-textures.js?v=20261009-life6"></script>

  <script type="text/plain" data-site-src="js/woods.js?v=20261010-guardian"></script>
  <script src="js/site-content.js?v=20261010-perf1"></script>
</body>
</html>
