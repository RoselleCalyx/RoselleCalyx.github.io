<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Little Farm · Chen Jia</title>
  <meta name="description" content="A small place for lovely lives: a snow leopard cat, an orchard through the seasons, and animals adopted by visitors." />
  <meta name="theme-color" content="#04060d" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23f4e2b4' d='M12 1c.5 6.4 4.6 10.5 11 11-6.4.5-10.5 4.6-11 11-.5-6.4-4.6-10.5-11-11 6.4-.5 10.5-4.6 11-11z'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css?v=20261010-signs" />
  <link rel="preload" href="assets/fonts/montserrat-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/cassini-type.css?v=20261009-1" />
  <link rel="stylesheet" href="css/mobile.css?v=20261009-4" />
  <link rel="stylesheet" href="css/farm-interactions.css?v=20261010-4" />
</head>
<body data-page="farm">
  <header id="site-header"></header>


  <main class="farm-page">
    <div class="farm-head">
      <div class="farm-title-group">
        <p class="kicker">A pocket of peace</p>
        <h1 class="page-title">My Little Farm<span class="farm-title-star" aria-hidden="true">✧</span></h1>
        <p class="page-sub">A small place for lovely lives.</p>
      </div>
      <p class="farm-welcome">Stay a little. Watch the seasons turn.</p>
    </div>

    <section class="farm-frame" aria-label="An interactive woodland farm">
      <div class="farm-scene-top">
        <div class="farm-hud">
          <div class="season-chip" id="seasonChip" aria-live="polite"></div>
          <div class="basket" id="basket" aria-live="polite"></div>
        </div>
        <span class="farm-population"><span aria-hidden="true">♡</span><span id="residentCount">Little lives</span></span>
      </div>
      <div class="farm-viewport" id="farmViewport" tabindex="0" aria-label="Farm garden. On smaller screens, scroll sideways to explore.">
        <div class="farm-world" id="world">
          <div class="actors" id="actors"></div>
        </div>
      </div>
      <div class="farm-scene-bottom">
        <p class="farm-hint"><span aria-hidden="true">✧</span> Tap a friend to pet, feed, or send a little love.</p>
        <span class="farm-pan-hint">← Explore the garden →</span>
      </div>
    </section>
    <p id="farmFeedback" class="feed-line farm-feedback" role="status" aria-live="polite" aria-atomic="true"></p>

    <div class="farm-actions with-ways" aria-label="Farm actions">
      <button type="button" id="btnAdopt"><span class="farm-action-icon" data-icon="paw"></span><span><b>Adopt an animal</b><small>A little friend, a new beginning</small></span><span class="farm-action-arrow" aria-hidden="true">↗</span></button>
      <button type="button" id="btnPlant"><span class="farm-action-icon" data-icon="sprout"></span><span><b>Plant a tree</b><small>Grow something lovely</small></span><span class="farm-action-arrow" aria-hidden="true">↗</span></button>
      <button type="button" id="btnHarvest"><span class="farm-action-icon" data-icon="basket"></span><span><b>Harvest</b><small>Gather the season’s little gifts</small></span><span class="farm-action-arrow" aria-hidden="true">↗</span></button>
      <button type="button" id="btnAnimals"><span class="farm-action-icon" data-icon="heart"></span><span><b>Meet the residents</b><small>Every little life has a story</small></span><span class="farm-action-arrow" aria-hidden="true">↗</span></button>
      <button type="button" id="btnWoods" class="way"><span class="farm-action-icon" data-icon="sprout"></span><span><b>Into the woods</b><small>Wild bayberries, mushrooms, shoots</small></span><span class="farm-action-arrow" aria-hidden="true">↗</span></button>
      <button type="button" id="btnPond" class="way pondway"><span class="farm-action-icon" data-icon="drop"></span><span><b>Down to the pond</b><small>Wooden rod, bamboo fish cover and traps</small></span><span class="farm-action-arrow" aria-hidden="true">↗</span></button>
    </div>

    <div class="farm-keeper-note">
      <button class="farm-keeper" type="button" id="meetKeeper" aria-label="Meet Matcha, keeper of the farm">
        <img src="assets/farm/snowcat.webp" alt="" width="320" height="320" />
        <span><small>Keeper of the orchard</small><b>Matcha is keeping watch.</b><span>Usually from the warmest rock in the garden.</span></span>
      </button>
      <p>Somewhere between the stars and the trees,<br /><em>there is a place to simply be.</em></p>
    </div>
  </main>

  <script>window.SKY_OPTIONS = { moon: false, milkyWay: false, meteors: 0.12 };</script>
  <script src="js/config.js"></script>
  <script src="js/sky.js"></script>
  <script src="js/common.js?v=20261009-mobile4"></script>
  <script src="js/backend.js"></script>
  <script src="data/farm.js?v=20261009-orchard-shapes9"></script>
  <script src="js/farm-motion.js?v=20261009-orchard-shapes9"></script>
  <script src="js/farm-art.js?v=20261009-orchard-shapes9"></script>
  <script src="js/orchard-sim.js?v=20261009-orchard-shapes9"></script>
  <script src="js/farm-fx.js?v=20261009-feed"></script>
  <script src="js/meadow-props.js?v=20261009-orchard-shapes9"></script>
  <script src="js/animal-reactions.js?v=20261009-interactions10"></script>
  <script src="js/farm.js?v=20261010-animal-icons7"></script>
</body>
</html>
