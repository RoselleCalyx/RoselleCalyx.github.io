<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Starmap · Chen Jia</title>
  <meta name="description" content="Choose a star. Meet its story. An interactive star map with constellations, planets and deep-sky objects." />
  <meta name="theme-color" content="#04060d" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23f4e2b4' d='M12 1c.5 6.4 4.6 10.5 11 11-6.4.5-10.5 4.6-11 11-.5-6.4-4.6-10.5-11-11 6.4-.5 10.5-4.6 11-11z'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css?v=20261010-owner-polish1" />
  <link rel="preload" href="assets/fonts/montserrat-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/cassini-type.css?v=20261009-1" />
  <link rel="stylesheet" href="css/mobile.css?v=20261009-4" />
</head>
<body data-page="starmap">
  <header id="site-header"></header>

  <main class="page">
    <div class="page-head">
      <h1 class="page-title" data-page-copy="title">Starmap</h1>
      <p class="page-sub" data-page-copy="subtitle">Choose a star. Meet its story.</p>
    </div>

    <div class="starmap-layout">
      <aside class="sm-side glass">
        <button class="btn sm-game cassini-btn" type="button" id="cassiniBtn"><span data-icon="star4"></span>Cassini’s journey</button>
        <div class="sm-modes" id="modeTabs" role="tablist" aria-label="What to show" aria-orientation="vertical">
          <button type="button" class="active" id="modeConst" role="tab" aria-selected="true" aria-controls="starmapPanel" tabindex="0" data-mode="const"><span data-icon="constel"></span>Constellations</button>
          <button type="button" id="modePlanets" role="tab" aria-selected="false" aria-controls="starmapPanel" tabindex="-1" data-mode="planets"><span data-icon="planet"></span>Planets</button>
          <button type="button" id="modeOrrery" role="tab" aria-selected="false" aria-controls="starmapPanel" tabindex="-1" data-mode="orrery"><span data-icon="target"></span>Solar System</button>
          <button type="button" id="modeDeep" role="tab" aria-selected="false" aria-controls="starmapPanel" tabindex="-1" data-mode="deep"><span data-icon="galaxy"></span>Deep Sky</button>
          <button type="button" id="modeFav" role="tab" aria-selected="false" aria-controls="starmapPanel" tabindex="-1" data-mode="fav"><span data-icon="starO"></span>My Favorites</button>
        </div>
        <ul class="sm-list" id="smList"></ul>
        <button class="btn sm-game" type="button" id="playQuiz"></button>
        <a class="btn sm-game" href="voyager.html"><span data-icon="planet"></span>A Lonely Voyager ↗</a>
      </aside>

      <div class="chart-wrap" id="starmapPanel" role="tabpanel" aria-labelledby="modeConst" tabindex="0">
        <canvas id="chart" aria-label="Interactive star map. Drag to pan. Pinch, use the zoom buttons, or hold Ctrl or Command while scrolling to zoom. Scroll firmly to move the page. Use the constellation list to choose objects or answer the game with a keyboard."></canvas>
        <div class="quiz-bar glass" id="quizBar" aria-live="polite"></div>
        <div class="chart-ctrl">
          <button type="button" id="zoomIn" aria-label="Zoom in" data-icon="plus"></button>
          <button type="button" id="zoomOut" aria-label="Zoom out" data-icon="minus"></button>
          <button type="button" id="zoomReset" aria-label="Show whole sky" data-icon="reset"></button>
        </div>
        <div class="chart-note" id="chartNote"></div>
        <canvas id="orrery" hidden aria-label="The solar system seen from above. Click a planet to visit it."></canvas>
        <div class="orrery-bar glass" id="orreryBar" hidden>
          <span class="o-date" id="oDate"></span>
          <button type="button" id="oSlower" aria-label="Slower">−</button>
          <button type="button" id="oPlay" aria-label="Pause">❚❚</button>
          <button type="button" id="oFaster" aria-label="Faster">+</button>
          <span class="o-speed" id="oSpeed"></span>
          <button type="button" id="oExit" hidden>Leave the journey</button>
        </div>
        <div class="journey-caption" id="journeyCaption" aria-live="polite"></div>
        <div class="planet-stage" id="planetStage" hidden>
          <canvas id="globe" aria-hidden="true"></canvas>
          <div class="ps-head"><h3 id="psName"></h3><p id="psSub"></p></div>
          <button class="icon-btn ps-close" id="psClose" type="button" aria-label="Close" data-icon="close"></button>
          <p class="ps-moons" id="psMoons"></p>
          <p class="ps-credit">Maps: <a href="https://www.solarsystemscope.com/textures/" target="_blank" rel="noopener">Solar System Scope</a> · NASA · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a></p>
        </div>
      </div>

      <aside class="sm-info glass" id="smInfo" aria-live="polite">
        <div class="info-head"></div>
        <canvas id="zoomChart" aria-hidden="true"></canvas>
        <div>
          <p class="story"></p>
          <dl class="facts"></dl>
          <button class="btn fav-btn" type="button" aria-pressed="false"></button>
        </div>
      </aside>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script>window.SKY_OPTIONS = { moon: false, milkyWay: false, meteors: 0.6 };</script>
  <script src="js/config.js"></script>
  <script src="data/sky.js"></script>
  <script type="text/plain" data-site-src="js/sky.js"></script>
  <script type="text/plain" data-site-src="js/common.js?v=20261010-owner-polish1"></script>
  <script type="text/plain" data-site-src="js/planet-globe.js?v=20261009-maps"></script>
  <script type="text/plain" data-site-src="js/orrery.js?v=20261009-orrery"></script>
  <script type="text/plain" data-site-src="js/starmap.js?v=20261010-keyboard"></script>
  <script src="js/site-content.js?v=20261010-owner-polish1"></script>
</body>
</html>
