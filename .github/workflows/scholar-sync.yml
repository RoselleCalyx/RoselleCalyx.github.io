name: Sync Google Scholar
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scholar-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read Scholar profile and complete article metadata
        run: node scripts/sync-scholar.mjs
      - name: Publish verified source snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/scholar.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Google Scholar source snapshot'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
