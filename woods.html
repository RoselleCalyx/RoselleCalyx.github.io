<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Into the Woods · Chen Jia</title>
  <meta name="description" content="Beyond the farm fence: wild bayberries, mushrooms after rain, bamboo shoots and whatever the season leaves." />
  <meta name="theme-color" content="#04060d" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23f4e2b4' d='M12 1c.5 6.4 4.6 10.5 11 11-6.4.5-10.5 4.6-11 11-.5-6.4-4.6-10.5-11-11 6.4-.5 10.5-4.6 11-11z'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=20261009-feed3" />
</head>
<body data-page="farm" class="wild-body" data-wild="woods">
  <header id="site-header"></header>

  <main class="farm-page wild-page">
    <div class="farm-head">
      <div class="farm-title-group">
        <p class="kicker">Beyond the fence</p>
        <h1 class="page-title">Into the Woods<span class="farm-title-star" aria-hidden="true">✧</span></h1>
        <p class="page-sub">Wild bayberries, mushrooms after rain, and whatever the season leaves.</p>
      </div>
      <p class="farm-welcome">Walk softly.<br />Take only what is ripe.</p>
    </div>

    <section class="farm-frame wild-frame" aria-label="A forest clearing beyond the farm">
      <div class="farm-scene-top">
        <div class="farm-hud">
          <button class="wild-back" type="button" id="btnBack"><span aria-hidden="true">←</span> The farm</button>
          <div class="season-chip" id="seasonChip" aria-live="polite"></div>
          <div class="basket" id="basket" aria-live="polite"></div>
        </div>
        <span class="farm-population"><span aria-hidden="true">❦</span>林间 · The woods</span>
      </div>
      <div class="wild-stage" id="stage">
        <canvas id="scene" aria-label="A forest clearing. Tap ripe berries and mushrooms to gather them."></canvas>
        <div class="wild-tip" id="tip" aria-hidden="true"></div>
      </div>
      <div class="farm-scene-bottom">
        <p class="farm-hint"><span aria-hidden="true">✧</span><b class="wild-hint" id="hint" aria-live="polite"></b></p>
      </div>
    </section>

    <div class="farm-actions wild-actions" aria-label="In the woods">
      <button type="button" id="btnJournal"><span class="farm-action-icon" data-icon="book"></span><span><b>Field journal</b><small>Everything you have found</small></span><span class="farm-action-arrow" aria-hidden="true">↗</span></button>
      <button type="button" id="btnLook"><span class="farm-action-icon" data-icon="search"></span><span><b>Look around</b><small>Spot what is ready to pick</small></span><span class="farm-action-arrow" aria-hidden="true">↗</span></button>
      <button type="button" id="btnYuki"><span class="farm-action-icon" data-icon="paw"></span><span><b>Ask Yuki</b><small>What grows this season?</small></span><span class="farm-action-arrow" aria-hidden="true">↗</span></button>
      <button type="button" id="btnBack2"><span class="farm-action-icon" data-icon="left"></span><span><b>Back to the farm</b><small>The orchard is waiting</small></span><span class="farm-action-arrow" aria-hidden="true">↙</span></button>
    </div>
  </main>

  <script>window.SKY_OPTIONS = { moon: false, milkyWay: false, meteors: 0.12 };</script>
  <script src="js/config.js"></script>
  <script src="js/sky.js"></script>
  <script src="js/common.js"></script>
  <script src="js/wild.js?v=20261009-grow"></script>
  <script src="js/woods.js?v=20261009-grow"></script>
</body>
</html>
